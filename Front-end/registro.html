<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Crear Usuario</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <!-- Navbar superior -->
    <nav class="navbar navbar-dark bg-black border-bottom border-success border-opacity-10 py-3 px-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold text-light">🔨 SubastaYa</span>
        </div>
    </nav>

    <!-- Contenedor del formulario de registro -->
    <div class="container my-auto py-5" style="max-width: 600px;">
        
        <span class="text-success text-uppercase fw-bold small tracking-wide">Registro</span>
        <h1 class="fw-bold display-6 mb-2 text-light">Crear cuenta nueva</h1>
        <p class="text-secondary small mb-4">
            Completá tus datos para registrarte en el sistema de subastas y comenzar a operar.
        </p>

        <!-- Tarjeta del formulario -->
        <div class="card bg-black border border-success border-opacity-25 p-4 p-md-5 rounded-4 shadow-lg">
            <form id="formRegistro">
                <div class="mb-3">
                    <label for="inputNombre" class="form-label text-light small">Nombre y Apellido</label>
                    <input type="text" id="inputNombre" class="form-control bg-dark text-light border-secondary py-2" placeholder="Tu nombre" required>
                </div>

                <div class="mb-3">
                    <label for="inputEmail" class="form-label text-light small">Correo electrónico</label>
                    <input type="email" id="inputEmail" class="form-control bg-dark text-light border-secondary py-2" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="inputPassword" class="form-label text-light small">Contraseña</label>
                    <input type="password" id="inputPassword" class="form-control bg-dark text-light border-secondary py-2" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="d-flex align-items-center gap-3 mt-4">
                    <button type="submit" class="btn btn-success px-4 py-2 fw-semibold">Registrarse</button>
                    <a href="login.html" class="btn btn-outline-secondary px-4 py-2">Ya tengo cuenta</a>
                </div>
            </form>

            <hr class="border-secondary opacity-25 my-4">

            <div class="text-center small">
                <span class="text-secondary">¿Volver al inicio?</span> 
                <a href="index.html" class="text-success text-decoration-none ms-1">Ir a la landing</a>
            </div>
        </div>

    </div>

    <!-- Script de lógica de registro conectada a la API de C# -->
    <script type="module">
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('inputNombre').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const password = document.getElementById('inputPassword').value.trim();

            try {
                // Realizamos el POST a tu API de C# para registrar el nuevo usuario
                const response = await fetch('http://localhost:5288/api/Usuarios', { // Ajustá la URL según tu endpoint de creación
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        nombre: nombre, 
                        email: email, 
                        password: password 
                    })
                });

                if (response.ok) {
                    alert('¡Usuario registrado con éxito! Ahora podés iniciar sesión.');
                    window.location.href = 'login.html'; // Lo mandamos al login para que ingrese
                } else {
                    const errorData = await response.json().catch(() => null);
                    alert('No se pudo completar el registro. Verificá los datos.');
                }

            } catch (error) {
                console.error('Error al registrar usuario:', error);
                alert('Ocurrió un error al conectar con el servidor para registrarte.');
            }
        });
    </script>
</body>
</html>
