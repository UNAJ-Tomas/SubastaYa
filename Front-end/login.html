<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Iniciar sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <!-- Navbar superior -->
    <nav class="navbar navbar-dark bg-black border-bottom border-success border-opacity-10 py-3 px-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold text-light">🔨 SubastaYa</span>
        </div>
    </nav>

    <!-- Contenedor del formulario -->
    <div class="container my-auto py-5" style="max-width: 600px;">
        
        <span class="text-success text-uppercase fw-bold small tracking-wide">Acceso</span>
        <h1 class="fw-bold display-6 mb-2 text-light">Iniciar sesión</h1>
        <p class="text-secondary small mb-4">
            Ingresá tu correo y la contraseña que definiste al registrarte para acceder a las subastas.
        </p>

        <!-- Tarjeta del formulario -->
        <div class="card bg-black border border-success border-opacity-25 p-4 p-md-5 rounded-4 shadow-lg">
            <form id="formLogin">
                <div class="mb-3">
                    <label for="inputEmail" class="form-label text-light small">Usuario (correo electrónico)</label>
                    <input type="email" id="inputEmail" class="form-control bg-dark text-light border-secondary py-2" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="inputPassword" class="form-label text-light small">Contraseña</label>
                    <input type="password" id="inputPassword" class="form-control bg-dark text-light border-secondary py-2" placeholder="Tu contraseña" required>
                </div>

                <div class="d-flex align-items-center gap-3 mt-4">
                    <button type="submit" class="btn btn-success px-4 py-2 fw-semibold">Entrar</button>
                    <a href="index.html" class="btn btn-outline-secondary px-4 py-2">Volver al inicio</a>
                </div>
            </form>

            <hr class="border-secondary opacity-25 my-4">

            <div class="d-flex justify-content-between small">
                <a href="#" class="text-success text-decoration-none">Olvidé mi contraseña</a>
                <a href="registro.html" class="text-success text-decoration-none">Crear usuario</a>
            </div>
        </div>

    </div>

    <!-- Script de lógica de login conectado a la API y al Model -->
<script type="module">
    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('inputEmail').value.trim();
        const password = document.getElementById('inputPassword').value.trim();

        if (!email || !password) {
            alert('Por favor, completa todos los campos.');
            return;
        }

        try {
            // Ajusta la URL según el puerto y la ruta de tu controlador en el Backend (C#)
            const response = await fetch('https://localhost:7083/api/Usuarios/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
        });

            if (!response.ok) {
                // Si el backend devuelve un 400, 401, etc., las credenciales son incorrectas
                alert('Correo o contraseña incorrectos.');
                return;
            }

            const data = await response.json();

            sessionStorage.setItem('tokenJWT', data.token);
            sessionStorage.setItem('usuarioActualId', data.id);
            sessionStorage.setItem('usuarioLogueado', data.email);

            // Redirigimos al home solo si la autenticación fue exitosa
            window.location.href = 'HTML/home.html';

        } catch (error) {
            console.error('Error de conexión con el servidor:', error);
            alert('No se pudo conectar con el servidor. Inténtalo más tarde.');
        }
    });
</script>
</body>
</html>
