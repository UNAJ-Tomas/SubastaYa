<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Depositar Dinero</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            position: relative;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: -1;
        }
        .card-custom {
            background-color: #ffffff !important;
            border-radius: 1.25rem !important;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .card-saldo {
            background-color: #f2f9f5 !important;
            border: 1px solid #d1e7dd;
            border-radius: 1rem !important;
        }
        .card-resumen {
            background-color: #fcfcfc !important;
            border: 1px solid #e9ecef;
            border-radius: 1rem !important;
        }
        .btn-monto-rapido {
            border: 1px solid #198754;
            color: #198754;
            background-color: transparent;
            border-radius: 50rem;
            transition: all 0.2s ease-in-out;
            font-weight: 500;
        }
        .btn-monto-rapido:hover, .btn-monto-rapido.active {
            background-color: #198754;
            color: #ffffff;
        }
        .btn-action-custom {
            background-color: #157347;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .btn-action-custom:hover {
            background-color: #146c43;
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- =========================
        NAVBAR COMPACTO
    ========================== -->
    <nav class="navbar navbar-dark px-4 py-3 shadow-sm" style="background-color: #0d3b2e; border-bottom: 3px solid #198754;">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-4 text-white text-decoration-none" href="home.html">
                SubastaYa <span class="text-warning">🔨</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="home.html" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-house-door me-1"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </nav>

    <!-- =========================
        CONTENIDO PRINCIPAL
    ========================== -->
    <main class="flex-grow-1 py-5">
        <div class="container">
            
            <!-- Encabezado de la Sección -->
            <div class="text-center mb-5">
                <div class="text-success mb-2">
                    <i class="bi bi-wallet2 fs-1"></i>
                </div>
                <h1 class="fw-bold text-dark display-6">Depositar dinero</h1>
                <p class="text-secondary">Agregá saldo a tu cuenta para poder participar en las subastas.</p>
            </div>

            <!-- Tarjeta Central de Depósito -->
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card card-custom shadow-sm p-4 p-md-5">

                        <!-- 1. Saldo Actual -->
                        <div class="card card-saldo p-4 mb-4 d-flex flex-row justify-content-between align-items-center shadow-none">
                            <div>
                                <span class="text-secondary small d-block mb-1">Saldo actual</span>
                                <h2 class="fw-bold text-success mb-0" id="lblSaldoActual">$0</h2>
                            </div>
                            <div class="text-success fs-1 opacity-75">
                                <i class="bi bi-wallet"></i>
                            </div>
                        </div>

                        <!-- 2. Input de Monto -->
                        <div class="mb-4">
                            <label for="inputMonto" class="form-label fw-semibold text-dark">¿Cuánto querés depositar?</label>
                            <div class="input-group input-group-lg bg-light rounded-pill border overflow-hidden px-2 shadow-none" style="border-color: #dee2e6 !important;">
                                <span class="input-group-text bg-transparent border-0 text-success ps-2 fs-4 fw-bold">$</span>
                                <input type="number" id="inputMonto" class="form-control bg-transparent border-0 shadow-none fs-4 text-dark" placeholder="0" min="1">
                            </div>
                            <small class="text-secondary mt-1 d-block ms-2">Ingresá el monto que querés agregar a tu saldo.</small>
                        </div>

                        <!-- 3. Montos Rápidos -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-dark small text-uppercase tracking-wider">Montos rápidos</label>
                            <div class="d-flex flex-wrap gap-2">
                                <button type="button" class="btn btn-monto-rapido px-3 py-1 btn-monto" data-valor="5000">$5.000</button>
                                <button type="button" class="btn btn-monto-rapido px-3 py-1 btn-monto" data-valor="10000">$10.000</button>
                                <button type="button" class="btn btn-monto-rapido px-3 py-1 btn-monto" data-valor="20000">$20.000</button>
                                <button type="button" class="btn btn-monto-rapido px-3 py-1 btn-monto" data-valor="50000">$50.000</button>
                            </div>
                        </div>

                        <!-- 4. Método de Pago -->
                        <div class="mb-4">
                            <label for="selectMetodoPago" class="form-label fw-semibold text-dark">Método de pago</label>
                            <select id="selectMetodoPago" class="form-select form-select-lg rounded-pill shadow-none fs-6 text-secondary">
                                <option value="" selected disabled>Seleccioná un método</option>
                                <option value="tarjeta">Tarjeta de Crédito / Débito</option>
                                <option value="transferencia">Transferencia Bancaria (Alias/CVU)</option>
                                <option value="mercadopago">Mercado Pago</option>
                            </select>
                        </div>

                        <!-- 5. Resumen de Transacción -->
                        <div class="card card-resumen p-3 mb-4 shadow-none">
                            <div class="d-flex justify-content-between mb-2 small text-secondary">
                                <span>Saldo actual</span>
                                <span id="resumenSaldoActual">$0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2 small text-secondary border-bottom pb-2">
                                <span>Depósito</span>
                                <span id="resumenDeposito">$0</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center pt-1">
                                <span class="fw-bold text-dark">Saldo después del depósito</span>
                                <span class="fw-bold text-success fs-5" id="resumenTotalFinal">$0</span>
                            </div>
                        </div>

                        <!-- Botón de Acción -->
                        <button type="button" id="btnConfirmarDeposito" class="btn btn-action-custom btn-lg rounded-pill w-100 text-white fw-semibold py-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-plus-circle fs-5"></i> Depositar dinero
                        </button>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center text-secondary small">
            © 2026 SubastaYa — Todos los derechos reservados.
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de interacción visual para los montos rápidos y resumen en tiempo real -->
    <script>
        const inputMonto = document.getElementById('inputMonto');
        const lblSaldoActual = document.getElementById('lblSaldoActual');
        const resumenSaldoActual = document.getElementById('resumenSaldoActual');
        const resumenDeposito = document.getElementById('resumenDeposito');
        const resumenTotalFinal = document.getElementById('resumenTotalFinal');
        const botonesMonto = document.querySelectorAll('.btn-monto');

        let saldoBase = 0; 

        function actualizarResumen() {
            let montoIngresado = parseFloat(inputMonto.value) || 0;
            lblSaldoActual.textContent = `$${saldoBase.toLocaleString()}`;
            resumenSaldoActual.textContent = `$${saldoBase.toLocaleString()}`;
            resumenDeposito.textContent = `$${montoIngresado.toLocaleString()}`;
            resumenTotalFinal.textContent = `$${(saldoBase + montoIngresado).toLocaleString()}`;
        }

        inputMonto.addEventListener('input', actualizarResumen);

        // Funcionalidad para los botones de montos rápidos
        botonesMonto.forEach(btn => {
            btn.addEventListener('click', () => {
                botonesMonto.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                inputMonto.value = btn.getAttribute('data-valor');
                actualizarResumen();
            });
        });

        // Inicializar
        actualizarResumen();
    </script>

    <script type="module" src="../js/controller.js"></script>

</body>
</html>
