<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Historial de Subastas</title>
    <!-- Estilos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="bg-dark text-white">

    <!-- Barra de navegación unificada -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="home.html">SubastaYa</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="crearSubasta.html">Crear Subasta</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="historial.html">Mi Historial</a>
                    </li>
                    <li class="nav-item ms-3">
                        <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container my-5">
        <h2 class="mb-4 text-success">Historial de Subastas Participadas</h2>
        
        <div class="card bg-black border-secondary p-4 shadow">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID Subasta</th>
                            <th>Título / Producto</th>
                            <th>Precio Inicial</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorial">
                    </tbody>
                </table>
            </div>
            <div id="mensajeVacio" class="text-center text-muted my-4" style="display: none;">
                No registraste participación en ninguna subasta todavía.
            </div>
        </div>
    </div>

    <script type="module">
        import { SubastaModel } from '../js/model.js'; 

        document.addEventListener('DOMContentLoaded', async () => {
            const usuarioId = sessionStorage.getItem('usuarioId') || 1;
            
            const tbody = document.getElementById('tablaHistorial');
            const mensajeVacio = document.getElementById('mensajeVacio');

            const subastas = await SubastaModel.obtenerSubastasParticipadas(usuarioId);

            if (!subastas || subastas.length === 0) {
                mensajeVacio.style.display = 'block';
                return;
            }

            tbody.innerHTML = '';
            subastas.forEach(subasta => {
                console.log("Subasta:", subasta.titulo, "-> Estado recibido:", subasta.estado);

                let estadoTexto = 'desconocido';
                let badgeClass = 'bg-secondary';
                
                const estadoNum = subasta.estado;

                if (estadoNum === 2 || estadoNum === 'Activa') {
                    estadoTexto = 'Activa';
                    badgeClass = 'bg-success';
                } 
                else if (estadoNum === 3 || estadoNum === 'Finalizada' || estadoNum === 'Cerrada') {
                    estadoTexto = 'Finalizada';
                    badgeClass = 'bg-dark border border-secondary text-white';
                } 
                else if (estadoNum === 0 || estadoNum === 'Pendiente') {
                    estadoTexto = 'Pendiente';
                    badgeClass = 'bg-warning text-dark';
                }

                const precio = subasta.precioInicial ?? subasta.precio_base ?? subasta.montoActual ?? 0;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${subasta.id || subasta.subastaId}</td>
                    <td>${subasta.titulo || subasta.producto || 'Sin título'}</td>
                    <td>$${precio}</td>
                    <td><span class="badge ${badgeClass}">${estadoTexto}</span></td>
                `;
                tbody.appendChild(tr);
            });
        });

        document.getElementById('btnCerrarSesion')?.addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = '../login.html';
        });
    </script>

    <!-- Bundle de JS de Bootstrap (¡Necesario para que el menú desplegable funcione!) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
